<title>Wall Street Walking Tour</title>
<style>

  #route-total { margin-top: 2px; max-width: 220px; }

  /* Route toggle */
  #controls { position: absolute; top: 60px; right: 12px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }

  .ctrl-btn.active { background: rgba(255,215,0,0.25); border-color: rgba(255,215,0,0.6); }

  /* Progress bar */
  #progress-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 200; background: rgba(255,255,255,0.1); }
  #progress-fill { height: 100%; background: #FFD700; transition: width 0.4s ease; width: 0%; }

  /* Bottom sheet */
  #sheet { position: absolute; bottom: 0; left: 0; right: 0; z-index: 200; background: #111; border-radius: 20px 20px 0 0; border-top: 1px solid rgba(255,255,255,0.1); transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1); max-height: 75dvh; display: flex; flex-direction: column; }

  #sheet-handle { width: 36px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; margin: 10px auto 0; flex-shrink: 0; }
  #sheet-header { padding: 12px 20px 10px; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
  #sheet-num { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: #FFD700; text-transform: uppercase; margin-bottom: 2px; }
  #sheet-title { font-size: 20px; font-weight: 700; line-height: 1.2; }
  #sheet-subtitle { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 2px; }
  #sheet-body { overflow-y: auto; padding: 16px 20px 32px; flex: 1; -webkit-overflow-scrolling: touch; }
  #sheet-body h3 { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #FFD700; margin: 14px 0 6px; }
  #sheet-body h3:first-child { margin-top: 0; }
  #sheet-body p { font-size: 14px; line-height: 1.65; color: rgba(255,255,255,0.82); margin-bottom: 10px; }
  #sheet-body ul { margin: 4px 0 12px 18px; color: rgba(255,255,255,0.82); font-size: 14px; line-height: 1.55; }
  #sheet-body li { margin-bottom: 6px; }
  #sheet-body .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  #sheet-body .tag { font-size: 11px; padding: 3px 10px; border-radius: 100px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.12); }
  #sheet-body .tag.finance { background: rgba(64,196,255,0.12); color: #73d2ff; border-color: rgba(64,196,255,0.35); }
  #sheet-body .tag.food { background: rgba(126,217,87,0.12); color: #9df578; border-color: rgba(126,217,87,0.35); }
  #sheet-nav { padding: 10px 16px 16px; display: flex; gap: 8px; flex-shrink: 0; border-top: 1px solid rgba(255,255,255,0.08); }
  #sheet-nav button { flex: 1; padding: 11px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
  #sheet-nav button:active { transform: scale(0.97); }
  #sheet-nav button.primary { background: #FFD700; color: #000; border-color: #FFD700; }
  #sheet-close { position: absolute; top: 14px; right: 16px; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,0.1); border: none; color: rgba(255,255,255,0.6); font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

  /* List overlay */
  #list-overlay { position: absolute; inset: 0; z-index: 300; background: #111; transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1); display: flex; flex-direction: column; }
  #list-overlay.open { transform: translateY(0); }
  #list-header { padding: 52px 20px 12px; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; }
  #list-header h2 { font-size: 18px; font-weight: 700; }
  #list-header button { padding: 7px 14px; border-radius: 10px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: #fff; font-size: 13px; cursor: pointer; }
  #tour-summary { padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.035); }
  #tour-summary .summary-title { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #FFD700; text-transform: uppercase; margin-bottom: 6px; }
  #tour-summary p { font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.76); }
  #list-scroll { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }

  .list-num.visited { background: rgba(255,215,0,0.2); color: #FFD700; }
  .list-info { flex: 1; min-width: 0; }
  .list-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-type { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 1px; }
  .list-num.finance { background: #40C4FF; color: #001018; }
  .list-num.finance.visited { background: rgba(64,196,255,0.18); color: #73d2ff; border: 1px solid rgba(64,196,255,0.45); }
  .list-num.food { background: #7ED957; color: #071800; }
  .list-num.food.visited { background: rgba(126,217,87,0.18); color: #9df578; border: 1px solid rgba(126,217,87,0.45); }
  .list-section { padding: 14px 20px 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.45); }
  .list-chev { color: rgba(255,255,255,0.25); font-size: 16px; }

  /* GPS status */
  #gps-dot { width: 8px; height: 8px; border-radius: 50%; background: #4CAF50; box-shadow: 0 0 0 0 rgba(76,175,80,0.4); animation: pulse 2s infinite; display: inline-block; margin-right: 5px; }
  #gps-dot.searching { background: #FF9800; box-shadow: 0 0 0 0 rgba(255,152,0,0.4); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(76,175,80,0.4); } 70% { box-shadow: 0 0 0 8px rgba(76,175,80,0); } 100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); } }

  /* Toast */
  #toast { position: absolute; top: 60px; left: 50%; transform: translateX(-50%) translateY(-80px); z-index: 400; background: rgba(30,30,30,0.95); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 10px 18px; font-size: 13px; color: #fff; white-space: nowrap; transition: transform 0.3s ease; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>

    <div class="meta"><span id="gps-dot" class="searching"></span><span id="gps-status">Locating…</span></div>

</div>

<div id="map"></div>

<div id="controls">

  <div id="sheet-body"></div>

  </div>
</div>

<div id="list-overlay">

  <div id="list-scroll" id="list-body"></div>
</div>

<div id="toast"></div>

function formatMinutes(minutes) {
  if (minutes < 60) return `${Math.round(minutes)} min`;
  const hours = Math.floor(minutes / 60);
  const mins = Math.round(minutes % 60);
  return mins ? `${hours} hr ${mins} min` : `${hours} hr`;
}

function renderParagraphs(value) {
  return (Array.isArray(value) ? value : [value])
    .filter(Boolean)
    .map(text => `<p>${text}</p>`)
    .join('');
}

function renderFacts(facts) {
  if (!facts || !facts.length) return '';
  return `
    <h3>Fun facts</h3>
    <ul>${facts.map(fact => `<li>${fact}</li>`).join('')}</ul>
  `;
}

function setRouteSummary(distanceKm = TOUR_ESTIMATE.fallbackKm, walkingMinutes = TOUR_ESTIMATE.fallbackMinutes, isFallback = false) {
  const distance = `${distanceKm.toFixed(1)} km`;
  const walking = formatMinutes(walkingMinutes);
  const prefix = isFallback ? 'Route estimate' : 'Full walking route';
  document.getElementById('route-total').textContent = `${prefix}: ${distance} · ${walking}`;
  document.getElementById('tour-summary-copy').textContent =
    `${prefix}: ${distance}, about ${walking} walking only. ${isFallback ? 'The walking line is hidden until Google Directions is available, so the map will not show misleading diagonal shortcuts. ' : ''}With reading time, photos, and short rests, plan on ${TOUR_ESTIMATE.withStops}. ${TOUR_ESTIMATE.note}`;
}

function setRouteError(message) {
  document.getElementById('route-total').textContent = `Route unavailable: ${message}`;
  document.getElementById('tour-summary-copy').textContent =
    `Google walking directions could not draw the route: ${message}. The app is showing stop markers only, without diagonal shortcut lines. ${TOUR_ESTIMATE.note}`;
}

function getRouteStops() {
  return ROUTE_STOP_IDS
    .map(id => STOPS.find(stop => stop.id === id))
    .filter(Boolean);
}

function getRouteIndices() {
  return ROUTE_STOP_IDS
    .map(id => STOPS.findIndex(stop => stop.id === id))
    .filter(index => index >= 0);
}

function getRoutePosition(idx) {
  return getRouteIndices().indexOf(idx);
}

function fallbackRouteDistanceKm() {
  const earthKm = 6371;
  const toRad = degrees => degrees * Math.PI / 180;
  let total = 0;
  const routeStops = getRouteStops();
  for (let i = 1; i < routeStops.length; i++) {
    const prev = routeStops[i - 1];
    const next = routeStops[i];
    const dLat = toRad(next.lat - prev.lat);
    const dLng = toRad(next.lng - prev.lng);
    const lat1 = toRad(prev.lat);
    const lat2 = toRad(next.lat);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
    total += 2 * earthKm * Math.asin(Math.sqrt(a));
  }
  return total * 1.25;
}

function chunkRouteStops(routeStops, maxIntermediateWaypoints = 8) {
  const chunks = [];
  let start = 0;
  const maxStopsPerRequest = maxIntermediateWaypoints + 2;

  while (start < routeStops.length - 1) {
    const end = Math.min(start + maxStopsPerRequest - 1, routeStops.length - 1);
    chunks.push(routeStops.slice(start, end + 1));
    start = end;
  }

  return chunks;
}

function initMap() {
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 40.7074, lng: -74.0102 },
    zoom: 16,
    mapTypeId: 'roadmap',
    disableDefaultUI: true,
    zoomControl: false,
    styles: [
      { elementType: 'geometry', stylers: [{ color: '#1a1a2e' }] },
      { elementType: 'labels.text.stroke', stylers: [{ color: '#1a1a2e' }] },
      { elementType: 'labels.text.fill', stylers: [{ color: '#8892a0' }] },
      { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#0d1b2a' }] },
      { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#2a2a3e' }] },
      { featureType: 'road', elementType: 'geometry.stroke', stylers: [{ color: '#1a1a2e' }] },
      { featureType: 'road.highway', elementType: 'geometry', stylers: [{ color: '#2c3e50' }] },
      { featureType: 'poi', elementType: 'geometry', stylers: [{ color: '#1e2a3a' }] },
      { featureType: 'transit', elementType: 'geometry', stylers: [{ color: '#1e2a3a' }] },
      { featureType: 'administrative', elementType: 'geometry', stylers: [{ color: '#3a3a5a' }] },
      { featureType: 'landscape', elementType: 'geometry', stylers: [{ color: '#1a1f2e' }] },
    ]
  });

  drawRoute();
  placeMarkers();
  startGPS();
  renderList();
  updateCounter();
  setRouteSummary(TOUR_ESTIMATE.fallbackKm, TOUR_ESTIMATE.fallbackMinutes, true);
}

function drawRoute() {
  const routeStops = getRouteStops();
  const directionsService = new google.maps.DirectionsService();
  const chunks = chunkRouteStops(routeStops);
  let totalMeters = 0;
  let totalSeconds = 0;
  let completed = 0;
  let failed = false;

  routeRenderers.forEach(renderer => renderer.setMap(null));
  routeRenderers = [];

  chunks.forEach(chunk => {
    const renderer = new google.maps.DirectionsRenderer({
      map,
      suppressMarkers: true,
      preserveViewport: true,
      polylineOptions: { strokeColor: '#FFD700', strokeOpacity: 0.7, strokeWeight: 4 }
    });
    routeRenderers.push(renderer);

    const waypoints = chunk.slice(1, -1).map(s => ({
      location: new google.maps.LatLng(s.lat, s.lng),
      stopover: true
    }));

    directionsService.route({
      origin: new google.maps.LatLng(chunk[0].lat, chunk[0].lng),
      destination: new google.maps.LatLng(chunk[chunk.length - 1].lat, chunk[chunk.length - 1].lng),
      waypoints,
      travelMode: google.maps.TravelMode.WALKING,
      optimizeWaypoints: false
    }, (result, status) => {
      completed += 1;

      if (status === 'OK') {
        renderer.setDirections(result);
        const legs = result.routes[0].legs;
        totalMeters += legs.reduce((sum, leg) => sum + leg.distance.value, 0);
        totalSeconds += legs.reduce((sum, leg) => sum + leg.duration.value, 0);
      } else {
        failed = true;
      }

      if (completed === chunks.length) {
        if (!failed && totalMeters > 0) {
          setRouteSummary(totalMeters / 1000, totalSeconds / 60, false);
        } else {
          routeRenderers.forEach(r => r.setMap(null));
          const distanceKm = fallbackRouteDistanceKm();
          setRouteError(`estimate ${distanceKm.toFixed(1)} km`);
          showToast('Walking route unavailable; showing stops only');
        }
      }
    });
  });
}

function placeMarkers() {
  STOPS.forEach((stop, i) => {
    const markerColor = stop.food ? '#7ED957' : stop.finance ? '#40C4FF' : '#FFD700';
    const labelColor = stop.food ? '#071800' : stop.finance ? '#001018' : '#000';
    const routePosition = getRoutePosition(i);
    const labelText = routePosition >= 0 ? String(routePosition + 1) : String(stop.id);
    const svgMarker = {
      path: 'M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z',
      fillColor: markerColor,
      fillOpacity: 1,
      strokeColor: '#000',
      strokeWeight: 1,
      scale: 1.5,
      anchor: new google.maps.Point(12, 24),
      labelOrigin: new google.maps.Point(12, 9)
    };

    const marker = new google.maps.Marker({
      position: { lat: stop.lat, lng: stop.lng },
      map,
      label: { text: labelText, color: labelColor, fontSize: '10px', fontWeight: '700' },
      icon: svgMarker,
      title: stop.name,
      zIndex: 100 + i
    });

    marker.addListener('click', () => openStop(i));
    markers.push(marker);
  });
}

function openStop(idx) {
  currentStopIdx = idx;
  const stop = STOPS[idx];
  const routePosition = getRoutePosition(idx);
  visitedStops.add(idx);

  document.getElementById('sheet-num').textContent = routePosition >= 0
    ? `Route stop ${routePosition + 1} of ${ROUTE_STOP_IDS.length}${stop.finance ? ' · Finance' : stop.food ? ' · Food' : ''}`
    : `${stop.finance ? 'Finance stop' : stop.food ? 'Food stop' : 'Stop'} ${stop.id}`;
  document.getElementById('sheet-title').textContent = stop.name;
  document.getElementById('sheet-subtitle').textContent = stop.type + (stop.era ? ` · Est. ${stop.era}` : '');

  const financeTag = stop.finance ? '<span class="tag finance">Finance Deep Dive</span>' : '';
  const foodTag = stop.food ? '<span class="tag food">Food Stop</span>' : '';
  const tagClass = stop.food ? ' food' : stop.finance ? ' finance' : '';
  const tags = financeTag + foodTag + stop.tags.map(t => `<span class="tag${tagClass}">${t}</span>`).join('');
  document.getElementById('sheet-body').innerHTML = `
    <div class="tag-row">${tags}</div>
    <h3>History</h3>
    ${renderParagraphs(stop.history)}
    <h3>Today</h3>
    ${renderParagraphs(stop.today)}
    ${renderFacts(stop.facts)}
    <h3>Visitor info</h3>
    ${renderParagraphs(stop.current)}
  `;

  updateMarkerVisited(idx);
  document.getElementById('sheet').classList.add('open');
  updateCounter();
  updateProgress();

  map.panTo({ lat: stop.lat, lng: stop.lng });

  document.getElementById('btn-prev').disabled = routePosition <= 0;
  document.getElementById('btn-next').disabled = routePosition < 0 || routePosition === ROUTE_STOP_IDS.length - 1;
  document.getElementById('btn-prev').style.opacity = routePosition <= 0 ? '0.35' : '1';
  document.getElementById('btn-next').style.opacity = routePosition < 0 || routePosition === ROUTE_STOP_IDS.length - 1 ? '0.35' : '1';
}

function updateMarkerVisited(idx) {
  const stop = STOPS[idx];
  const svgVisited = {
    path: 'M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z',
    fillColor: '#444',
    fillOpacity: 1,
    strokeColor: stop.food ? '#7ED957' : stop.finance ? '#40C4FF' : '#FFD700',
    strokeWeight: 1.5,
    scale: 1.5,
    anchor: new google.maps.Point(12, 24),
    labelOrigin: new google.maps.Point(12, 9)
  };
  markers[idx].setIcon(svgVisited);
  markers[idx].setLabel({ text: '✓', color: stop.food ? '#9df578' : stop.finance ? '#73d2ff' : '#FFD700', fontSize: '10px', fontWeight: '700' });
}

function navStop(dir) {
  if (currentStopIdx === null) return;
  const routeIndices = getRouteIndices();
  const routePosition = routeIndices.indexOf(currentStopIdx);
  const next = routePosition + dir;
  if (routePosition >= 0 && next >= 0 && next < routeIndices.length) openStop(routeIndices[next]);
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
}

function openDirections() {
  if (currentStopIdx === null) return;
  const s = STOPS[currentStopIdx];
  window.open(`https://maps.google.com/?q=${s.lat},${s.lng}`, '_blank');
}

function centerOnMe() {
  if (userMarker) {
    map.panTo(userMarker.getPosition());
    map.setZoom(17);
  } else {
    showToast('GPS not yet available');
  }
}

function toggleRoute() {
  showRoute = !showRoute;
  routeRenderers.forEach(renderer => renderer.setMap(showRoute ? map : null));
  document.getElementById('btn-route').classList.toggle('active', showRoute);
}

function updateCounter() {
  document.getElementById('stop-counter').textContent = `${visitedStops.size} / ${STOPS.length} stops`;
}

function updateProgress() {
  const pct = (visitedStops.size / STOPS.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function startGPS() {
  if (!navigator.geolocation) {
    document.getElementById('gps-status').textContent = 'GPS unavailable';
    return;
  }

  watchId = navigator.geolocation.watchPosition(pos => {
    const { latitude: lat, longitude: lng, accuracy } = pos.coords;

    document.getElementById('gps-dot').classList.remove('searching');
    document.getElementById('gps-status').textContent = `±${Math.round(accuracy)}m`;

    const position = { lat, lng };

    if (!userMarker) {
      userMarker = new google.maps.Marker({
        position,
        map,
        icon: {
          path: google.maps.SymbolPath.CIRCLE,
          scale: 9,
          fillColor: '#4285F4',
          fillOpacity: 1,
          strokeColor: '#fff',
          strokeWeight: 2.5,
        },
        title: 'You are here',
        zIndex: 1000
      });
    } else {
      userMarker.setPosition(position);
    }

    autoDetectNearby(lat, lng);
  }, err => {
    document.getElementById('gps-status').textContent = 'GPS denied';
    document.getElementById('gps-dot').classList.add('searching');
  }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}

function autoDetectNearby(lat, lng) {
  const THRESHOLD = 0.0003; // ~30 meters
  STOPS.forEach((stop, i) => {
    if (visitedStops.has(i)) return;
    const dLat = Math.abs(stop.lat - lat);
    const dLng = Math.abs(stop.lng - lng);
    if (dLat < THRESHOLD && dLng < THRESHOLD) {
      showToast(`📍 Near: ${stop.name} — tap to open`);
    }
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function openList() {
  document.getElementById('list-overlay').classList.add('open');
}

function closeList() {
  document.getElementById('list-overlay').classList.remove('open');
}

function renderList() {
  const container = document.getElementById('list-scroll');
  const routeItems = getRouteIndices().map((i, routePosition) => ({ stop: STOPS[i], i, routePosition }));
  const renderItems = items => items.map(({ stop, i, routePosition }) => `
    <div class="list-item" onclick="closeList(); openStop(${i})">
      <div class="list-num ${stop.food ? 'food ' : stop.finance ? 'finance ' : ''}${visitedStops.has(i) ? 'visited' : ''}">${visitedStops.has(i) ? '✓' : routePosition + 1}</div>
      <div class="list-info">
        <div class="list-name">${stop.name}</div>
        <div class="list-type">${stop.type}</div>
      </div>
      <span class="list-chev">›</span>
    </div>
  `).join('');

  container.innerHTML = `
    <div class="list-section">Optimized route order · gold = iconic · blue = finance · green = food</div>
    ${renderItems(routeItems)}
  `;
}

document.getElementById('sheet').addEventListener('click', e => {
  if (e.target === document.getElementById('sheet')) closeSheet();
});

let startY = 0;
document.getElementById('sheet-handle').addEventListener('touchstart', e => { startY = e.touches[0].clientY; });
document.getElementById('sheet-handle').addEventListener('touchend', e => {
  if (e.changedTouches[0].clientY - startY > 60) closeSheet();
});
</script>

<script async defer
  src="https://maps.googleapis.com/maps/api/js?key=__GOOGLE_MAPS_API_KEY__&callback=initMap">
</script>

</body>
</html>
